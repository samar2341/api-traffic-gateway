<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API TRAFFIC GATEWAY</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">

        <h1>🛡 API TRAFFIC GATEWAY</h1>
        <p>API Traffic Control Engine</p>

        <div class="card">

            <h2>API Playground</h2>

            <label>User ID</label>

            <input
                id="userId"
                type="number"
                value="101"
            >

            <label>Endpoint</label>

            <select id="endpoint">

                <option value="/products">GET /products</option>

                <option value="/login">POST /login</option>

                <option value="/profile">GET /profile</option>

                <option value="/orders">POST /orders</option>

            </select>

            <button id="sendBtn">

                Send Request

            </button>

        </div>

        <div class="card">

            <h2>Response</h2>

            <pre id="response">Waiting...</pre>

            <div class="stats-card">
                <h2>Live Statistics</h2>

                <p>Total Requests :
                    <span id="total">0</span>
                </p>

                <p>Allowed :
                    <span id="allowed">0</span>
                </p>

                <p>Blocked :
                    <span id="blocked">0</span>
                </p>

                <p>Active Users :
                    <span id="users">0</span>
                </p>
            </div>

            <div class="history-card">
                <h2>Request History</h2>
                <ul id="historyList"></ul>
            </div>

        </div>

    </div>

<script src="./js/app.js"></script>

</body>

</html>
